name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: ruff check app tests scripts
      - run: pytest -m "not distributed"

  distributed-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: automation
          POSTGRES_USER: automation
          POSTGRES_PASSWORD: automation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U automation -d automation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTOMATION_DATABASE_URL: postgresql+psycopg://automation:automation@127.0.0.1:5432/automation
      REDIS_URL: redis://127.0.0.1:6379/0
      RUN_DISTRIBUTED_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: pytest -m distributed

  admission-benchmark:
    runs-on: ubuntu-latest
    env:
      AUTOMATION_DB_PATH: benchmark.db
      DISPATCH_BACKEND: database
      LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - name: Start API
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn-benchmark.log 2>&1 &
          echo $! > uvicorn.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat uvicorn-benchmark.log
          exit 1
      - name: Run admission benchmark
        run: |
          python scripts/load_test.py \
            --base-url http://127.0.0.1:8000 \
            --requests 500 \
            --concurrency 25 | tee benchmark-result.txt
      - name: Stop API
        if: always()
        run: |
          if [ -f uvicorn.pid ]; then
            kill "$(cat uvicorn.pid)" || true
          fi

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: enterprise-automation-orchestrator:ci
